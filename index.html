<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOP Refresh Training Report</title>
<style>
:root{--navy:#102a43;--blue:#1769aa;--cyan:#25a6c7;--gold:#f5b544;--bg:#f3f6fa;--ink:#243447;--muted:#6b7c93;--white:#fff;--green:#16865b;--red:#c0392b;--shadow:0 12px 32px #102a4314}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e8f1f8;color:var(--navy)}.danger{background:#fff0ef;color:var(--red)}.muted{color:var(--muted)}.hidden{display:none!important}
.hero{min-height:190px;padding:28px 5%;color:#fff;background:linear-gradient(100deg,#102a43ed,#1769aacc),url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1800&q=80') center/cover;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px);letter-spacing:.4px}.hero p{margin:0;color:#e4edf5}.heroTag{background:#ffffff20;border:1px solid #ffffff55;border-radius:30px;padding:10px 15px;font-size:12px;font-weight:800;letter-spacing:1px}
.wrap{max-width:1500px;margin:auto;padding:24px}.loginWrap{max-width:440px;margin:7vh auto;padding:0 18px}.panel,.card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:22px}.loginPanel{padding:30px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:800;color:#42566b}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #d9e2ec;border-radius:10px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:#e7edf3;color:#34495e}.nav button.active{background:var(--navy);color:#fff}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}.metric{padding:18px;border-radius:16px;background:#fff;box-shadow:var(--shadow);border-left:4px solid var(--cyan)}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;font-size:30px;margin-top:8px;color:var(--navy)}.sectionTitle{font-size:19px;margin:0 0 14px;color:var(--navy)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tableWrap{overflow:auto;border:1px solid #e6edf3;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:650px;background:#fff}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1f5;font-size:13px}th{background:#edf4f9;color:#34495e;position:sticky;top:0}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:800;background:#e8f1f8;color:#1769aa}.pill.good{background:#e4f6ed;color:#16865b}.pill.warn{background:#fff3d9;color:#946200}.pill.bad{background:#ffebe9;color:#b9382d}
.scoreGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.scoreBtn{border:2px solid #dce5ed;background:#fff;color:#42566b;padding:13px 6px}.scoreBtn.selected{border-color:var(--blue);background:#e8f3fb;color:var(--blue)}.scoreBtn b{display:block;font-size:22px}.sopCard{border:1px solid #e3eaf0;border-radius:14px;padding:16px;margin:12px 0}.sopCard h4{margin:0 0 7px}.sopCard p{font-size:13px;line-height:1.5;color:#526579;white-space:pre-wrap}.critical{color:#b9382d;font-size:11px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:13px 15px;border-radius:12px;background:#eaf4fb;color:#174d70;margin:12px 0;font-size:13px}.empty{text-align:center;color:var(--muted);padding:28px}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{text-align:center;color:#8795a5;font-size:12px;padding:30px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.hero{padding:22px 18px;min-height:160px}.heroTag{display:none}.grid{gap:9px}.metric{padding:14px}.metric strong{font-size:25px}.panel{padding:16px}.formRow{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr}.nav button{padding:12px 7px;font-size:12px}.scoreBtn{padding:11px 3px}.scoreBtn b{font-size:20px}}
</style>
</head>
<body>
<div id="loginView" class="loginWrap">
  <div class="panel loginPanel">
    <div style="font-size:12px;font-weight:900;color:#1769aa;letter-spacing:1.5px">AREA OPERATIONS SYSTEM</div>
    <h1 style="color:#102a43;margin:8px 0">SOP REFRESH<br>TRAINING REPORT</h1>
    <p class="muted">Improve Knowledge. Improve Performance.</p>
    <div class="field"><label>User ID</label><input id="loginId" autocomplete="username" placeholder="Contoh: TL001"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Masukkan password"></div>
    <button class="primary" style="width:100%;padding:15px" onclick="login()">LOGIN</button>
    <p id="loginMsg" class="muted" style="font-size:13px"></p>
  </div>
</div>
<div id="appView" class="hidden">
  <header class="hero">
    <div><div style="font-size:11px;letter-spacing:2px;font-weight:900;color:#bfe7f5">AREA TRAINING MONITORING</div><h1>SOP REFRESH TRAINING REPORT</h1><p>Improve Knowledge. Improve Performance.</p></div>
    <div class="heroTag">WEEKLY SOP REFRESH • V1.0</div>
  </header>
  <main class="wrap">
    <div class="topline"><div><b id="welcome"></b><div id="scope" class="muted" style="font-size:12px;margin-top:4px"></div></div><button class="secondary" onclick="logout()">LOGOUT</button></div>
    <nav class="nav" id="nav"></nav>
    <section id="page"></section>
  </main>
  <div class="footer">SOP REFRESH TRAINING REPORT V1.1 • Area Operations</div>
</div>
<script>
/* PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL BELOW */
const CONFIG_API_URL = 'https://script.google.com/macros/s/AKfycbwaSZxh5mXdzWf_UPHNOxAvrWC8s3SDGAOtB99BBkcYGyME6I90UiZ2nROJzkoD6wYuHA/exec';
// Isi dengan URL deployment Web App yang berakhiran /exec.
// Contoh format: https://script.google.com/macros/s/AKfy.../exec

let session = null, data = null, currentPage = 'dashboard', selectedScores = {};
const menu = [
 ['dashboard','Dashboard'],['program','Weekly Program'],['input','Input Training'],
 ['crew','Master Crew'],['sop','SOP Library'],['report','Kesimpulan'],
 ['history','Training History'],['users','User Access']
];
function api(payload){
 return new Promise((resolve,reject)=>{
  if(!CONFIG_API_URL.startsWith('https://script.google.com/')) return reject(new Error('URL Apps Script belum dipasang di index.html.'));
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  const timer=setTimeout(()=>{
   cleanup();
   reject(new Error('Proses melewati 120 detik. Periksa akses spreadsheet sumber dan menu Apps Script > Executions.'));
  },120000);
  function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
  window[cb]=(res)=>{cleanup();res&&res.ok?resolve(res):reject(new Error(res&&res.error?res.error:'Request gagal.'));};
  script.onerror=()=>{cleanup();reject(new Error('Tidak dapat terhubung ke server Apps Script.'))};
  const params=new URLSearchParams({callback:cb,payload:JSON.stringify(payload)});
  script.src=CONFIG_API_URL+'?'+params.toString();
  document.body.appendChild(script);
 });
}
function authPayload(extra={}){return {...extra,userId:session.userId,password:session.password};}
async function login(){
 const userId=val('loginId').trim().toUpperCase(),password=val('loginPass');
 msg('loginMsg','Memeriksa akun...');
 try{
  const r=await api({action:'login',userId,password});
  session={userId,password,...r.user};
  currentPage = 'dashboard';
  await refreshData();showApp();render();
 }catch(e){msg('loginMsg',e.message);}
}
async function refreshData(){
 data=await api(authPayload({action:'bootstrap'}));
 const report=await api(authPayload({action:'getReport'}));
 data.details=report.details||[];
}
function showApp(){
 document.getElementById('loginView').classList.add('hidden');
 document.getElementById('appView').classList.remove('hidden');
 document.getElementById('welcome').textContent=session.fullName+' • '+session.role;
 document.getElementById('scope').textContent=session.role==='AM'?'Akses seluruh area':'Store: '+session.storeName;
}
function logout(){session=null;data=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');}
function render(){
 const nav=document.getElementById('nav');nav.innerHTML='';
 const visibleMenu = session.role === 'TL'
   ? menu.filter(m => ['dashboard','input','sop'].includes(m[0]))
   : menu;
 visibleMenu.forEach(m=>{
  const b=document.createElement('button');b.textContent=m[1];b.className=currentPage===m[0]?'active':'';
  b.onclick=()=>{currentPage=m[0];render()};nav.appendChild(b);
 });
 const page=document.getElementById('page');
 const fn={dashboard:dashboardPage,program:programPage,input:inputPage,crew:crewPage,sop:sopPage,report:reportPage,history:historyPage,users:usersPage};
 page.innerHTML='';page.appendChild(fn[currentPage]());
}
function el(tag,cls,html){const x=document.createElement(tag);if(cls)x.className=cls;if(html!==undefined)x.innerHTML=html;return x;}
function val(id){return document.getElementById(id)?.value||''}
function msg(id,t){const x=document.getElementById(id);if(x)x.textContent=t}
function metric(label,value){return el('div','metric',`<small>${esc(label)}</small><strong>${esc(value)}</strong>`)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function options(items,valueFn,labelFn,selected=''){return items.map(x=>`<option value="${esc(valueFn(x))}" ${String(valueFn(x))===String(selected)?'selected':''}>${esc(labelFn(x))}</option>`).join('')}
function field(label,id,placeholder='',type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`}
function selectField(label,id,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts}</select></div>`}
function dateNow(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});}
function dashboardPage(){
 const root=el('div');
 const results=data.results||[],crew=data.crew||[];
 if(session.role==='TL'){
  const ownResults=results.filter(r =>
   String(r.storeId||'')===String(session.storeId||'') ||
   String(r.storeName||'')===String(session.storeName||'')
  );
  const understood=ownResults.filter(r=>String(r.status||'').toUpperCase()==='SUDAH MEMAHAMI').length;
  const follow=ownResults.filter(r=>String(r.status||'').toUpperCase()!=='SUDAH MEMAHAMI').length;
  const sopCount=(data.sops||[]).filter(s=>s.status!=='INACTIVE').length;
  const grid=el('div','grid');
  [metric('TOTAL REFRESH TRAINING',ownResults.length),
   metric('SUDAH MEMAHAMI',understood),
   metric('PERLU PENGUATAN',follow),
   metric('MATERI SOP AKTIF',sopCount)
  ].forEach(x=>grid.appendChild(x));
  root.appendChild(grid);
  root.appendChild(el('div','panel',`<h3 class="sectionTitle">Dashboard Training — ${esc(session.storeName||'Store Saya')}</h3>
   <p class="muted">Pantau hasil refresh training crew di store kamu dan akses materi SOP terbaru.</p>
   <div class="actions">
    <button class="primary" id="goInputTraining">INPUT TRAINING</button>
    <button class="secondary" id="goSopLibrary">BUKA SOP LIBRARY</button>
   </div>`));
  root.appendChild(el('div','panel',`<h3 class="sectionTitle">Riwayat Refresh Terbaru</h3>
   ${table(['Tanggal','Crew','Department','Kategori','Nilai','Kesimpulan'],
    ownResults.slice().reverse().slice(0,10).map(r=>[
     r.trainingDate,r.crewName,r.department,r.section,
     Number(r.average||0).toFixed(2),statusPill(r.status)
    ]),true)}`));
  root.querySelector('#goInputTraining').onclick=()=>{currentPage='input';render();};
  root.querySelector('#goSopLibrary').onclick=()=>{currentPage='sop';render();};
  return root;
 }
 const latestByCrew={};results.forEach(r=>{const k=r.programId+'|'+r.nik;if(!latestByCrew[k]||latestByCrew[k].attempt<r.attempt)latestByCrew[k]=r;});
 const latest=Object.values(latestByCrew),understood=latest.filter(r=>r.status==='SUDAH MEMAHAMI').length,follow=latest.filter(r=>r.status!=='SUDAH MEMAHAMI').length;
 const targetPrograms=(data.programs||[]).filter(p=>p.status==='ACTIVE');
 const activeTarget=targetPrograms.reduce((n,p)=>n+crew.filter(c=>c.department===p.department&&c.section===p.section).length,0);
 const done=latest.length,percent=activeTarget?Math.min(100,Math.round(done/activeTarget*100)):0;
 const grid=el('div','grid');[metric('ACTIVE CREW',crew.length),metric('ACTIVE PROGRAM',targetPrograms.length),metric('SUDAH MEMAHAMI',understood),metric('PERLU FOLLOW-UP',follow)].forEach(x=>grid.appendChild(x));root.appendChild(grid);
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Weekly Training Overview</h3><div style="font-size:13px;color:#66788a">Target indikatif dari program aktif • ${done} hasil evaluasi tercatat</div><div style="height:13px;background:#e7edf3;border-radius:20px;margin:14px 0;overflow:hidden"><div style="height:100%;width:${percent}%;background:linear-gradient(90deg,#1769aa,#25a6c7);border-radius:20px"></div></div><b>${percent}% completion indikatif</b><p class="muted" style="font-size:12px">Catatan: angka completion menghitung hasil evaluasi crew yang sudah masuk dibanding target aktif. Jika ada beberapa program aktif dengan section yang sama, target dapat terhitung lebih dari satu kali.</p>`));
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Program Aktif</h3>${targetPrograms.length?table(['Program','Periode','Department','Section','Target'],targetPrograms.map(p=>[p.name,p.weekLabel,p.department,p.section,p.targetCount])):'<div class="empty">Belum ada program aktif.</div>'}`));
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Evaluasi Terbaru</h3>${table(['Tanggal','Crew','Store','Section','Attempt','Average','Status'],results.slice().reverse().slice(0,10).map(r=>[r.trainingDate,r.crewName,r.storeName,r.section,r.attempt,r.average.toFixed(2),statusPill(r.status)]),true)}`));
 return root;
}
function table(headers,rows,rawLast=false){
 if(!rows.length)return '<div class="empty">Belum ada data.</div>';
 return `<div class="tableWrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>'<tr>'+row.map((v,i)=>`<td>${rawLast&&i===row.length-1?v:esc(v)}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`;
}
function statusPill(s){let c=s==='SUDAH MEMAHAMI'?'good':s.includes('KRITIS')||s==='RETRAINING'||s==='BELUM MEMAHAMI'?'bad':'warn';return `<span class="pill ${c}">${esc(s)}</span>`;}
function programPage(){
 const root=el('div');
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Buat Weekly Program</h3>
 <div class="formRow">${field('Nama Program','pName','Contoh: SOP Refresh Week 46')}${field('Label Minggu','pWeek','Week 46 - 2026')}</div>
 <div class="formRow">${field('Tanggal Mulai','pStart','', 'date')}${field('Tanggal Akhir','pEnd','','date')}</div>
 <div class="formRow">${selectField('Department','pDept','<option>FRONT</option><option>BACK</option>')}${selectField('Section','pSection','')}</div>
 <div class="field"><label>Pilih SOP (bisa lebih dari satu)</label><div id="pSopList" class="notice">Pilih department dan section untuk memuat SOP.</div></div>
 <div class="actions"><button class="primary" onclick="saveProgram()">SIMPAN PROGRAM</button></div><p id="programMsg" class="muted"></p>`));
 const dept=root.querySelector('#pDept'),section=root.querySelector('#pSection'),list=root.querySelector('#pSopList');
 function loadSections(){const sections=[...new Set(data.sops.filter(s=>s.department===dept.value).map(s=>s.section))];section.innerHTML=options(sections,x=>x,x=>x);loadSops();}
 function loadSops(){const sops=data.sops.filter(s=>s.department===dept.value&&s.section===section.value);list.innerHTML=sops.length?sops.map(s=>`<label style="display:block;padding:7px"><input type="checkbox" value="${esc(s.sopId)}" class="pSop"> ${esc(s.code)} - ${esc(s.title)} ${s.critical?'(CRITICAL)':''}</label>`).join(''):'Tidak ada SOP aktif untuk section ini.';}
 dept.onchange=loadSections;section.onchange=loadSops;loadSections();
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Daftar Program</h3>${table(['Program ID','Program','Week','Section','Target','Status'],data.programs.map(p=>[p.programId,p.name,p.weekLabel,p.section,p.targetCount,p.status]))}`));
 return root;
}
async function saveProgram(){
 const sopIds=[...document.querySelectorAll('.pSop:checked')].map(x=>x.value);
 try{const r=await api(authPayload({action:'saveProgram',name:val('pName'),weekLabel:val('pWeek'),startDate:val('pStart'),endDate:val('pEnd'),department:val('pDept'),section:val('pSection'),sopIds}));msg('programMsg',r.message+' Target crew: '+r.targetCount);await refreshData();render();}
 catch(e){msg('programMsg',e.message);}
}
function inputPage(){
 const root=el('div');
 const isTL=session.role==='TL';
 const storeOptions=options(data.stores,s=>s.storeId,s=>s.storeName,session.storeId);
 root.appendChild(el('div','panel',`
  <h3 class="sectionTitle">Input Training</h3>
  <div class="notice">Pilih department, kategori materi, tanggal training, dan crew. Sistem otomatis memuat seluruh materi SOP aktif pada kategori yang dipilih. Tidak menggunakan periode mingguan.</div>
  <div class="formRow">
   ${selectField('Department','iDept','<option value="">Pilih Department</option><option value="FRONT">FRONT</option><option value="BACK">BACK</option>')}
   ${selectField('Kategori Materi','iCategory','<option value="">Pilih department terlebih dahulu</option>')}
  </div>
  <div class="formRow">
   ${selectField('Store','iStore',storeOptions)}
   ${selectField('Crew','iCrew','<option value="">Pilih crew</option>')}
  </div>
  <div class="formRow">
   ${field('Tanggal Training','iTrainingDate', '', 'date')}
   <div class="field"><label>Trainer</label><input value="${esc(session.fullName)}" disabled></div>
  </div>
  <div id="evalArea"></div>
  <div class="field"><label>Catatan Training (opsional)</label><textarea id="iNotes" placeholder="Catatan pelaksanaan training..."></textarea></div>
  <div class="actions"><button class="primary" id="submitTrainingBtn" type="button">SUBMIT HASIL TRAINING</button></div>
  <p id="inputMsg" class="muted"></p>
 `));
 const dept=root.querySelector('#iDept');
 const category=root.querySelector('#iCategory');
 const store=root.querySelector('#iStore');
 const crew=root.querySelector('#iCrew');
 const area=root.querySelector('#evalArea');
 const date=root.querySelector('#iTrainingDate');
 date.value=dateNow();
 if(isTL){store.value=session.storeId;store.disabled=true;}

 function clearEvaluation(){
  area.innerHTML='';
  selectedScores={};
 }
 function loadCategories(){
  const cats=[...new Set((data.sops||[])
   .filter(s=>s.department===dept.value && s.status!=='INACTIVE')
   .map(s=>s.category).filter(Boolean))].sort();
  category.innerHTML='<option value="">Pilih kategori materi</option>'+
   options(cats,x=>x,x=>x);
  loadCrew();
  clearEvaluation();
 }
 function loadCrew(){
  const list=(data.crew||[]).filter(c=>
   c.storeId===store.value && c.department===dept.value
  ).sort((a,b)=>a.name.localeCompare(b.name));
  crew.innerHTML='<option value="">Pilih crew</option>'+
   options(list,c=>c.nik,c=>c.name+' • '+c.nik);
  clearEvaluation();
 }
 function loadEval(){
  clearEvaluation();
  const selectedCrew=(data.crew||[]).find(c=>c.nik===crew.value);
  const sops=(data.sops||[]).filter(s=>
   s.department===dept.value && s.category===category.value && s.status!=='INACTIVE'
  ).sort((a,b)=>Number(a.sequence||0)-Number(b.sequence||0));
  if(!dept.value || !category.value || !selectedCrew)return;
  if(!sops.length){
   area.innerHTML='<div class="notice">Belum ada materi SOP aktif untuk kategori ini. Hubungi Area Manager untuk sinkronisasi SOP.</div>';
   return;
  }
  area.appendChild(el('div','panel',`<h3 class="sectionTitle">Materi Evaluasi — ${esc(category.value)}</h3><p class="muted">${sops.length} materi SOP ditemukan</p>`));
  sops.forEach(s=>{
   const card=el('div','sopCard',`
    <h4>${esc(s.title)} ${s.critical?'<span class="critical"> • CRITICAL SOP</span>':''}</h4>
    <p>${esc(s.code)} · ${esc(s.itemType||'PRODUCT & PROCESS')}</p>
    ${s.link?`<p><a href="${esc(s.link)}" target="_blank" rel="noopener noreferrer">BUKA DOKUMEN SOP ↗</a></p>`:''}
    <div class="scoreGrid">${[[1,'Belum memahami'],[2,'Cukup memahami'],[3,'Memahami'],[4,'Sangat memahami']].map(([n,t])=>`<button type="button" class="scoreBtn" data-score="${n}"><b>${n}</b><small>${t}</small></button>`).join('')}</div>
    <div class="field"><label>Kekurangan / Temuan</label><textarea class="short" placeholder="Catat bagian yang belum dipahami..."></textarea></div>
    <div class="field"><label>Tindak Lanjut / Coaching</label><textarea class="action" placeholder="Rencana perbaikan atau coaching..."></textarea></div>
   `);
   card.dataset.sopId=s.sopId;
   card.querySelectorAll('.scoreBtn').forEach(btn=>btn.onclick=()=>{
    card.querySelectorAll('.scoreBtn').forEach(x=>x.classList.remove('selected'));
    btn.classList.add('selected');
    selectedScores[s.sopId]=Number(btn.dataset.score);
   });
   area.appendChild(card);
  });
 }
 dept.onchange=loadCategories;
 category.onchange=loadEval;
 store.onchange=loadCrew;
 crew.onchange=loadEval;
 root.querySelector('#submitTrainingBtn').onclick=submitTraining;
 loadCategories();
 return root;
}
async function submitTraining(){
 const department=val('iDept'),category=val('iCategory'),nik=val('iCrew');
 const trainingDate=val('iTrainingDate');
 const cards=[...document.querySelectorAll('#evalArea .sopCard')];
 if(!department||!category||!nik||!trainingDate){
  msg('inputMsg','Lengkapi department, kategori, tanggal training, dan crew.');
  return;
 }
 if(!cards.length){msg('inputMsg','Materi SOP belum dimuat. Periksa kategori atau sinkronisasi SOP.');return;}
 if(cards.some(c=>!selectedScores[c.dataset.sopId])){
  msg('inputMsg','Semua materi SOP wajib diberikan nilai sebelum submit.');return;
 }
 const evaluations=cards.map(c=>({
  sopId:c.dataset.sopId,score:selectedScores[c.dataset.sopId],
  shortcoming:c.querySelector('.short').value,
  action:c.querySelector('.action').value
 }));
 const btn=document.getElementById('submitTrainingBtn');
 btn.disabled=true;btn.textContent='MENYIMPAN...';
 try{
  const r=await api(authPayload({
   action:'submitQuickEvaluation',department,category,nik,trainingDate,
   evaluations,notes:val('iNotes')
  }));
  msg('inputMsg',`${r.message} • Attempt ${r.attempt} • Rata-rata ${r.average} • ${r.status}`);
  await refreshData();
  render();
 }catch(e){msg('inputMsg',e.message);}
 finally{
  const b=document.getElementById('submitTrainingBtn');
  if(b){b.disabled=false;b.textContent='SUBMIT HASIL TRAINING';}
 }
}
function crewPage(){
 const root=el('div');
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Tambah / Update Master Crew</h3>
 <div class="formRow">${field('NIK','cNik','Nomor induk crew')}${field('Nama Crew','cName','Nama lengkap')}</div>
 <div class="formRow">${selectField('Store','cStore',options(data.stores,s=>s.storeId,s=>s.storeName))}${selectField('Department','cDept','<option>FRONT</option><option>BACK</option>')}</div>
 <div class="formRow">${selectField('Section','cSection','')}${selectField('Status','cStatus','<option>ACTIVE</option><option>RESIGN</option>')}</div>
 <div class="actions"><button class="primary" onclick="saveCrew()">SIMPAN CREW</button></div><p id="crewMsg" class="muted"></p>`));
 const dept=root.querySelector('#cDept'),section=root.querySelector('#cSection');
 function sections(){const arr=dept.value==='BACK'?['Bakaran','Masakan','Racikan','Checker']:['Minuman','Kasir','Order Taker','Runner','Host'];section.innerHTML=options(arr,x=>x,x=>x);}
 dept.onchange=sections;sections();
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Master Crew Aktif</h3>${table(['NIK','Nama','Store','Department','Section','Status'],data.crew.map(c=>[c.nik,c.name,c.storeName,c.department,c.section,'ACTIVE']))}`));
 return root;
}
async function saveCrew(){
 try{const r=await api(authPayload({action:'saveCrew',nik:val('cNik'),name:val('cName'),storeId:val('cStore'),department:val('cDept'),section:val('cSection'),status:val('cStatus')}));msg('crewMsg',r.message);await refreshData();render();}
 catch(e){msg('crewMsg',e.message);}
}
function sopPage(){
 const root=el('div');
 const panel=el('div','panel');
 panel.appendChild(el('div','topline',`<div><h3 class="sectionTitle" style="margin:0">SOP Library</h3><div class="muted" style="font-size:12px;margin-top:5px">Daftar materi tersinkron dari spreadsheet sumber SOP.</div></div>${session.role==='AM'?'<button class="primary" id="syncSopBtn">SYNC SOP SEKARANG</button>':''}`));
 panel.appendChild(el('div','notice','Sistem membaca kolom A-B untuk Product & Process dan kolom D-E untuk Preparation, mulai baris 4 pada setiap sheet sumber.'));
 const controls=el('div','formRow');
 controls.innerHTML=`<div class="field"><label>Cari nama materi / kode SOP</label><input id="sopSearch" placeholder="Ketik nama menu atau preparation..."></div><div class="field"><label>Filter Department</label><select id="sopDeptFilter"><option value="">Semua Department</option><option>FRONT</option><option>BACK</option><option>SPECIAL</option></select></div>`;
 panel.appendChild(controls);
 const list=el('div');
 panel.appendChild(list);
 root.appendChild(panel);

 function draw(){
  const q=val('sopSearch').toLowerCase();
  const dept=val('sopDeptFilter');
  const items=(data.sops||[]).filter(s=>(!dept||s.department===dept)&&
    (!q||[s.title,s.code,s.category,s.itemType].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.department.localeCompare(b.department)||a.category.localeCompare(b.category)||a.sequence-b.sequence||a.title.localeCompare(b.title));
  const rows=items.map(s=>{
    const safeLink=String(s.link||'').trim();
    const validLink=/^https?:\/\//i.test(safeLink);
    const documentLink=validLink
      ? `<a class="secondary openSopLink" href="${esc(safeLink)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:700;white-space:nowrap">BUKA SOP ↗</a>`
      : '<span class="pill warn">LINK BELUM TERSEDIA</span>';
    return [
      s.department,s.category,s.itemType||s.standard,s.title,
      s.status||'ACTIVE',
      documentLink
    ];
  });
  list.innerHTML=`<div class="topline" style="margin:14px 0"><b>${items.length} materi ditemukan</b><span class="muted" style="font-size:12px">Total library: ${(data.sops||[]).length}</span></div>${table(['Department','Sheet Sumber','Jenis Materi','Nama Materi','Status','Dokumen'],rows,true)}`;
 }
 const syncButton=panel.querySelector('#syncSopBtn');
 if(syncButton) syncButton.onclick=async()=>{
  const btn=syncButton;btn.disabled=true;btn.textContent='SINKRONISASI...';
  try{
   const r=await api(authPayload({action:'syncSopSource'}));
   await refreshData();
   alert(r.message+' Total materi: '+r.imported+(r.missingTabs&&r.missingTabs.length?'\\nTab tidak ditemukan: '+r.missingTabs.join(', '):''));
   draw();
  }catch(e){alert(e.message);}
  finally{btn.disabled=false;btn.textContent='SYNC SOP SEKARANG';}
 };
 controls.querySelector('#sopSearch').addEventListener('input',draw);
 controls.querySelector('#sopDeptFilter').addEventListener('change',draw);
 draw();
 return root;
}
async function saveSop(){
 try{const r=await api(authPayload({action:'saveSop',department:val('sDept'),section:val('sSection'),code:val('sCode'),title:val('sTitle'),standard:val('sStandard'),sequence:val('sSeq'),category:val('sCategory'),critical:val('sCritical')==='true',status:val('sStatus')}));msg('sopMsg',r.message);await refreshData();render();}
 catch(e){msg('sopMsg',e.message);}
}
function reportPage(){
 const root=el('div');
 const results=data.results||[];
 const details=data.details||[];
 const understood=results.filter(r=>r.status==='SUDAH MEMAHAMI').length;
 const follow=results.filter(r=>r.status!=='SUDAH MEMAHAMI').length;
 const avg=results.length?(results.reduce((n,r)=>n+Number(r.average||0),0)/results.length).toFixed(2):'0.00';
 const grid=el('div','grid');
 [
  metric('TOTAL REFRESH',results.length),
  metric('SUDAH MEMAHAMI',understood),
  metric('PERLU PENGUATAN',follow),
  metric('RATA-RATA NILAI',avg)
 ].forEach(x=>grid.appendChild(x));
 root.appendChild(grid);
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Kesimpulan Pemahaman SOP</h3>
  <p class="muted">Ringkasan hasil refresh training berdasarkan materi yang telah dievaluasi. Status pemahaman memperhitungkan nilai rata-rata dan temuan pada SOP critical.</p>
  ${table(['Tanggal','Department','Kategori Materi','Crew','Store','Rata-rata','Kesimpulan'],results.slice().reverse().map(r=>[
   r.trainingDate,r.department,r.section,r.crewName,r.storeName,
   Number(r.average||0).toFixed(2),statusPill(r.status)
  ]),true)}`));
 const byCategory={};
 details.forEach(d=>{
  const key=(d.sopTitle||'Tanpa nama SOP');
  if(!byCategory[key])byCategory[key]={title:key,count:0,total:0,low:0,critical:0};
  const x=byCategory[key];x.count++;x.total+=Number(d.score||0);
  if(Number(d.score)<=2)x.low++;
  if(String(d.critical).toUpperCase()==='YES'&&Number(d.score)<=2)x.critical++;
 });
 const categoryRows=Object.values(byCategory).sort((a,b)=>(b.low-a.low)).map(x=>[
  x.title,x.count,(x.total/x.count).toFixed(2),x.low,x.critical
 ]);
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Kesimpulan Materi yang Sudah Di-refresh</h3>
  ${table(['Materi SOP','Jumlah Evaluasi','Rata-rata Nilai','Nilai 1–2','Critical Follow-up'],categoryRows,true)}`));
 const weak=details.filter(d=>Number(d.score)<=2);
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Materi yang Masih Perlu Penguatan</h3>
  ${table(['Crew','Materi SOP','Nilai','Critical','Temuan','Tindak Lanjut'],weak.map(d=>[
   d.crewName,d.sopCode+' - '+d.sopTitle,d.score,d.critical,d.shortcoming,d.action
  ]),true)}`));
 return root;
}
function historyPage(){
 const root=el('div');const results=data.results||[];
 const grouped={};results.forEach(r=>{const k=r.nik+'|'+r.programId;if(!grouped[k])grouped[k]=[];grouped[k].push(r);});
 root.appendChild(el('div','panel',`<h3 class="sectionTitle">Training History & Retraining Progress</h3>${table(['Crew','NIK','Program','Week','Store','Attempt','Average','Status','Tanggal'],results.slice().sort((a,b)=>a.nik.localeCompare(b.nik)||a.attempt-b.attempt).map(r=>[r.crewName,r.nik,r.programName,r.weekLabel,r.storeName,r.attempt,r.average.toFixed(2),statusPill(r.status),r.trainingDate]),true)}`));
 return root;
}
